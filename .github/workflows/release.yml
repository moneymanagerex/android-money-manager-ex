name: Build and Release

on:
  push:
    branches:
      - 'release/v*' # Triggers on any branch starting with "release/v" (e.g., release/v5.5, release/v6.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for reading tag and PR history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > app/release.keystore

      - name: Build All Release Bundles and APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease

      - name: Get Version Code and Name
        id: version
        run: |
          # Extracts both versionCode and versionName from build.gradle
          VERSION_NAME=$(grep -m 1 'versionName "' app/build.gradle | cut -d'"' -f2)
          VERSION_CODE=$(grep -m 1 'versionCode ' app/build.gradle | awk '{print $2}')
  
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        
          echo "=== BUILD VERSION INFO ==="
          echo "VERSION_NAME: $VERSION_NAME"
          echo "VERSION_CODE: $VERSION_CODE"
          echo "========================="          

      - name: Prepare GPlay Changelog
        run: |
          CODE="${{ steps.version.outputs.version_code }}"
          # Path to the file used for F-Droid
          SRC="metadata/android/en-US/changelogs/$CODE.txt"
          
          # Creates the temporary folder for GPlay and copies/renames the file
          mkdir -p gplay-changelogs/en-US
          if [ -f "$SRC" ]; then
            cp "$SRC" "gplay-changelogs/en-US/whatsnew-$CODE"
            echo "Changelog found and copied for GPlay."
          else
            echo "Warning: Changelog file for versionCode $CODE not found!"
            # Creates a fallback file with generic text if missing
            echo "Bug fixes and improvements" > "gplay-changelogs/en-US/whatsnew-$CODE"
          fi

      - name: Create GitHub Release with Auto-Generated Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_name }} 
          name: "${{ steps.version.outputs.version_name }}"   
          generate_release_notes: true
          prerelease: false
          files: |
            app/build/outputs/bundle/fdroidRelease/*.aab
            app/build/outputs/bundle/gplayRelease/*.aab
            app/build/outputs/bundle/syncRelease/*.aab
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/gplay/release/*.apk
            app/build/outputs/apk/sync/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GPlay to Beta Track
        if: false # Re-enable by setting to 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          service_account_json_PlainText: ${{ secrets.SERVICE_ACCOUNT_JSON_GPLAY }}
          packageName: 'com.money.manager.ex.android'
          releaseFiles: app/build/outputs/bundle/gplayRelease/app-gplay-release.aab
          track: beta
          status: completed
          whatsNewDirectory: 'gplay-changelogs'
