name: Test GPlay Upload

on:
  workflow_dispatch: # Ti permette di avviarlo manualmente da GitHub quando vuoi

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > app/release.keystore

      - name: Build GPlay Release Bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleGplayRelease

      - name: Prepare GPlay Changelog
        run: |
          # Estrae temporaneamente la versione per il changelog di test
          VERSION_CODE=$(grep -m 1 'versionCode ' app/build.gradle | awk '{print $2}')
          mkdir -p gplay-changelogs/en-US
          echo "Test release from GitHub Actions" > "gplay-changelogs/en-US/whatsnew-$VERSION_CODE"

      - name: Publish GPlay to Beta Track (Test)
        uses: r0adkll/upload-google-play@v1
        with:
          service_account_json_PlainText: ${{ secrets.SERVICE_ACCOUNT_JSON_GPLAY }}
          packageName: 'com.money.manager.ex.android'
          releaseFiles: app/build/outputs/bundle/gplayRelease/*.aab
          track: 'beta'
          status: 'completed'
          whatsNewDirectory: 'gplay-changelogs'